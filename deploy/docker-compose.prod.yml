# Production stack for a single VM (DigitalOcean Droplet, etc.):
#   caddy (HTTPS automático) -> app (Next.js standalone) -> postgres
# Uso (desde la raíz del repo, en el servidor):
#   cp deploy/.env.production.example .env.production   # y edítalo
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env.production up -d --build
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ccp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-child_care_passport}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Solo accesible desde la VM (túnel SSH para administrar), nunca desde internet.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ccp} -d ${POSTGRES_DB:-child_care_passport}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ..
      target: migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ccp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-child_care_passport}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
      APP_URL: ${APP_URL:?set APP_URL}
      SEED_DEMO: ${SEED_DEMO:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Demo1234!secure}
      ALLOW_DEMO_SEED: ${ALLOW_DEMO_SEED:-false}

  app:
    build:
      context: ..
      target: runtime
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL}
      SHARE_BASE_URL: ${SHARE_BASE_URL:-${APP_URL}}
      DATABASE_URL: postgresql://${POSTGRES_USER:-ccp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-child_care_passport}?schema=public
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      MAILER_PROVIDER: ${MAILER_PROVIDER:-console}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-Child Care Passport <no-reply@localhost>}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      STORAGE_LOCAL_DIR: /data/storage
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      SEED_DEMO: ${SEED_DEMO:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Demo1234!secure}
      FEATURE_AI_PROFILE_ASSISTANT: ${FEATURE_AI_PROFILE_ASSISTANT:-true}
      FEATURE_INSTITUTION_PORTAL: ${FEATURE_INSTITUTION_PORTAL:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - storage:/data/storage
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS (domain or ip.sslip.io)}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  storage:
  caddy_data:
  caddy_config:
