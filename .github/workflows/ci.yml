name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://ccp:ccp@localhost:5432/ccp_test?schema=public
  AUTH_SECRET: ci-only-secret-value-with-at-least-32-characters
  AUTH_TRUST_HOST: "true"
  APP_URL: http://localhost:3100
  SEED_DEMO: "true"
  DEMO_PASSWORD: Demo1234!secure
  STORAGE_PROVIDER: local
  STORAGE_LOCAL_DIR: ./storage

jobs:
  quality:
    name: install · lint · typecheck · test · build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ccp
          POSTGRES_PASSWORD: ccp
          POSTGRES_DB: ccp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ccp -d ccp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Migrate
        run: npx prisma migrate deploy
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests
        run: npm run test:integration
      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
          retention-days: 1

  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ccp
          POSTGRES_PASSWORD: ccp
          POSTGRES_DB: ccp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ccp -d ccp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npm run build
        env:
          NODE_ENV: production
      - run: npx playwright test
        env:
          CI: "true"
          NODE_ENV: production
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
